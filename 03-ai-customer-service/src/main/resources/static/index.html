<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能客服 · 小知</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #fafafa;
            --surface: #ffffff;
            --border: #e5e5e5;
            --text: #1a1a1a;
            --text-secondary: #666666;
            --text-muted: #999999;
            --accent: #10b981;
            --accent-hover: #059669;
            --radius: 12px;
            --radius-lg: 16px;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            line-height: 1.5;
        }

        .chat-container {
            width: 100%;
            max-width: 720px;
            height: 90vh;
            max-height: 800px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ==================== 头部 ==================== */
        .chat-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--text);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .chat-header .title-wrap {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .chat-header h1 {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
        }

        .chat-header .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
        }

        /* ==================== 聊天区 ==================== */
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .msg-row {
            display: flex;
            gap: 10px;
            max-width: 80%;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-row.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .msg-row.ai {
            align-self: flex-start;
        }

        .msg-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
        }

        .msg-row.user .msg-avatar {
            background: var(--text);
            color: white;
        }

        .msg-row.ai .msg-avatar {
            background: var(--border);
            color: var(--text-secondary);
        }

        .msg-body {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        .msg-row.user .msg-body {
            align-items: flex-end;
        }

        .msg-bubble {
            padding: 10px 14px;
            border-radius: var(--radius);
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .msg-row.user .msg-bubble {
            background: var(--text);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .msg-row.ai .msg-bubble {
            background: var(--bg);
            color: var(--text);
            border-bottom-left-radius: 4px;
        }

        .msg-row.ai .msg-bubble.typing::after {
            content: " ▋";
            color: var(--accent);
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .msg-time {
            font-size: 11px;
            color: var(--text-muted);
            padding: 0 4px;
        }

        /* ==================== 快捷问题栏 ==================== */
        .quick-questions {
            padding: 12px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .quick-questions::-webkit-scrollbar {
            display: none;
        }

        .quick-btn {
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            transition: all 0.15s ease;
            font-family: inherit;
        }

        .quick-btn:hover {
            background: var(--text);
            color: white;
            border-color: var(--text);
        }

        /* ==================== 输入区 ==================== */
        .input-area {
            padding: 16px 24px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 14px;
            outline: none;
            transition: border-color 0.15s ease;
            background: var(--bg);
            color: var(--text);
            font-family: inherit;
        }

        #input:focus {
            border-color: var(--text);
            background: var(--surface);
        }

        #input::placeholder {
            color: var(--text-muted);
        }

        #sendBtn {
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 500;
            background: var(--text);
            color: #ffffff;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.15s ease;
            font-family: inherit;
        }

        #sendBtn:hover:not(:disabled) {
            background: #333;
        }

        #sendBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ==================== Token 统计栏 ==================== */
        .token-stat {
            padding: 10px 24px 14px;
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .token-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            background: var(--bg);
            color: var(--text-secondary);
        }

        .token-chip .label {
            color: var(--text-muted);
        }

        .token-chip .value {
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .token-chip.input .value { color: var(--accent); }
        .token-chip.output .value { color: #f59e0b; }
        .token-chip.total .value { color: var(--text); }

        /* ==================== 欢迎语 ==================== */
        .welcome-tip {
            align-self: center;
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.8;
        }

        .welcome-tip .emoji {
            font-size: 36px;
            display: block;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <!-- 头部 -->
    <div class="chat-header">
        <div class="avatar">🤖</div>
        <div class="title-wrap">
            <h1>智能客服 · 小知</h1>
            <div class="subtitle">
                <span class="status-dot"></span>
                <span>在线服务</span>
            </div>
        </div>
    </div>

    <!-- 聊天区 -->
    <div id="chat">
        <div class="welcome-tip">
            <span class="emoji">💬</span>
            你好，我是小知<br>
            可以问我关于年假、退款、发票等问题
        </div>
    </div>

    <!-- 快捷问题栏 -->
    <div class="quick-questions" id="quickQuestions">
    </div>

    <!-- 输入区 -->
    <div class="input-area">
        <input id="input" type="text" placeholder="输入您的问题..." autocomplete="off"
               maxlength="500"
               onkeypress="if(event.key==='Enter') send()">
        <button id="sendBtn" onclick="send()">发送</button>
    </div>

    <!-- Token 统计栏 -->
    <div class="token-stat">
        <span class="token-chip input">
            <span class="label">输入</span>
            <span class="value" id="inputTokens">0</span>
        </span>
        <span class="token-chip output">
            <span class="label">输出</span>
            <span class="value" id="outputTokens">0</span>
        </span>
        <span class="token-chip total">
            <span class="label">总计</span>
            <span class="value" id="totalTokens">0</span>
        </span>
    </div>
</div>

<script>
    // ========== 会话 ID ==========
    const currentCid = (() => {
        let cid = sessionStorage.getItem('cid');
        if (!cid) {
            cid = 'u-' + Math.random().toString(36).substring(2, 10);
            sessionStorage.setItem('cid', cid);
        }
        return cid;
    })();

    // ========== 快捷问题列表 ==========
    const QUICK_QUESTIONS = [
        "年假政策",
        "退款政策",
        "发票怎么开",
        "人工客服电话",
        "服务时间",
        "产品价格"
    ];

    // 动态渲染快捷问题按钮
    function renderQuickQuestions() {
        const container = document.getElementById('quickQuestions');
        container.innerHTML = '';
        QUICK_QUESTIONS.forEach(q => {
            const btn = document.createElement('button');
            btn.className = 'quick-btn';
            btn.textContent = q;
            btn.type = 'button';
            btn.onclick = () => {
                document.getElementById('input').value = q;
                send();
            };
            container.appendChild(btn);
        });
    }

    // ========== 时间格式化 ==========
    function nowTime() {
        const d = new Date();
        const hh = String(d.getHours()).padStart(2, '0');
        const mm = String(d.getMinutes()).padStart(2, '0');
        return `${hh}:${mm}`;
    }

    // ========== 添加消息 ==========
    function addMsg(role, text) {
        const chat = document.getElementById("chat");
        const welcome = chat.querySelector('.welcome-tip');
        if (welcome) welcome.remove();

        const row = document.createElement("div");
        row.className = "msg-row " + role;

        const avatar = document.createElement("div");
        avatar.className = "msg-avatar";
        avatar.textContent = role === "user" ? "👤" : "🤖";

        const body = document.createElement("div");
        body.className = "msg-body";

        const bubble = document.createElement("div");
        bubble.className = "msg-bubble";
        bubble.textContent = text;

        const time = document.createElement("div");
        time.className = "msg-time";
        time.textContent = nowTime();

        body.appendChild(bubble);
        body.appendChild(time);
        row.appendChild(avatar);
        row.appendChild(body);
        chat.appendChild(row);

        chat.scrollTop = chat.scrollHeight;
        return bubble;
    }

    // ========== Token 统计 ==========
    async function fetchTokenStat() {
        try {
            const resp = await fetch('/api/v1/customer-service/token-stat');
            const result = await resp.json();
            if (result.code === 200) {
                const data = result.data;
                document.getElementById('inputTokens').textContent = data.inputTokens;
                document.getElementById('outputTokens').textContent = data.outputTokens;
                document.getElementById('totalTokens').textContent = data.totalTokens;
            }
        } catch (e) {
            console.error('Token 统计请求失败:', e);
        }
    }

    // ========== 发送消息 ==========
    async function send() {
        const inputEl = document.getElementById("input");
        const sendBtn = document.getElementById("sendBtn");
        const question = inputEl.value.trim();
        if (!question) return;

        addMsg("user", question);
        const aiBubble = addMsg("ai", "");
        aiBubble.classList.add("typing");

        inputEl.value = "";
        inputEl.focus();
        sendBtn.disabled = true;

        try {
            const resp = await fetch("/api/v1/customer-service/chat/stream", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    conversationId: currentCid,
                    question: question
                })
            });

            if (!resp.ok) {
                aiBubble.textContent = "请求失败：" + resp.status;
                aiBubble.classList.remove("typing");
                return;
            }

            const reader = resp.body.getReader();
            const decoder = new TextDecoder();
            let buffer = "";
            let fullText = "";

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });

                let idx;
                while ((idx = buffer.indexOf("\n\n")) !== -1) {
                    const event = buffer.substring(0, idx);
                    buffer = buffer.substring(idx + 2);

                    for (const line of event.split("\n")) {
                        if (line.startsWith("data:")) {
                            const text = line.substring(5).trimStart();
                            if (text && text !== "[DONE]") {
                                fullText += text;
                            }
                        }
                    }
                }
                aiBubble.textContent = fullText;
                document.getElementById("chat").scrollTop =
                    document.getElementById("chat").scrollHeight;
            }

            aiBubble.classList.remove("typing");
            fetchTokenStat();

        } catch (err) {
            aiBubble.textContent = "错误：" + err.message;
            aiBubble.classList.remove("typing");
        } finally {
            sendBtn.disabled = false;
        }
    }

    // ========== 初始化 ==========
    renderQuickQuestions();
    fetchTokenStat();
</script>

</body>
</html>
