server:
  port: 8090

# 数据源配置
spring:
  application:
    name: saas-kb
  datasource:
    url: jdbc:mysql://localhost:3306/saas_kb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

# Swagger 配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: status
      logic-delete-value: 0
      logic-not-delete-value: 1

# 自定义分页配置
kb:
  default-page-size: 10
  max-page-size: 100
